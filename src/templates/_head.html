    <!-- Critical CSS (inlined for fast LCP) -->
    <style>
    @font-face{font-family:'Poppins';src:url('{{ROOT_PATH}}poppins-400.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
    @font-face{font-family:'Poppins';src:url('{{ROOT_PATH}}poppins-600.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap}

    @font-face{font-family:'Montserrat';src:url('{{ROOT_PATH}}montserrat-800.woff2') format('woff2');font-weight:800;font-style:normal;font-display:swap}
    :root{--primary-purple:#4a1a6b;--primary-magenta:#8b1a6b;--white:#ffffff;--off-white:#f8f9fa;--light-gray:#e9ecef;--font-primary:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--font-heading:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--spacing-xs:0.5rem;--spacing-sm:1rem;--spacing-md:1.5rem;--spacing-lg:2rem;--spacing-xl:3rem;--spacing-xxl:5rem;--radius-md:8px;--shadow-sm:0 2px 4px rgba(0,0,0,0.08);--transition-fast:0.2s ease;--transition-normal:0.3s ease;--container-max:1200px}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;font-size:16px}
    body{font-family:var(--font-primary);font-size:1.25rem;line-height:1.7;color:var(--off-white);background-color:#2f0048;-webkit-font-smoothing:antialiased}
    img{max-width:100%;height:auto;display:block}
    a{text-decoration:none;color:inherit;transition:var(--transition-fast)}
    ul,ol{list-style:none}
    h1,h2,h3,h4,h5,h6{font-family:var(--font-heading);font-weight:700;line-height:1.2;margin-bottom:var(--spacing-sm)}
    h1{font-size:clamp(2rem,5vw,3rem);color:#fff}
    h2{font-size:clamp(1.75rem,4vw,2.5rem);color:#FFEF76}
    h3{font-size:clamp(1.25rem,3vw,1.75rem);color:#71CEEB}
    .container{width:100%;max-width:var(--container-max);margin:0 auto;padding:0 var(--spacing-md)}
    .header{position:sticky;top:0;z-index:1000;background-color:#2f0048;box-shadow:var(--shadow-sm)}
    .nav-bar{padding:var(--spacing-sm) 0}
    .nav-inner{display:flex;justify-content:space-between;align-items:center;gap:var(--spacing-md)}
    .logo-group{display:flex;align-items:center;gap:10px}
    .logo img{height:80px;width:auto}
    .navbar-mascot{display:none;height:50px;width:auto}
    .nav-menu{display:flex;align-items:center;gap:var(--spacing-xs)}
    .nav-item{position:relative}
    .nav-link{display:block;padding:var(--spacing-sm) var(--spacing-md);font-weight:700;color:#71CEEB;font-size:1.1rem;border-radius:var(--radius-md);transition:var(--transition-fast)}
    .nav-link:hover{color:#FFEF76;background-color:#3d0059}
    .nav-dropdown{position:absolute;top:100%;left:0;min-width:200px;background-color:#2f0048;box-shadow:0 8px 24px rgba(0,0,0,0.16);border-radius:var(--radius-md);opacity:0;visibility:hidden;transform:translateY(10px);transition:var(--transition-normal);z-index:100;padding:var(--spacing-xs) 0}
    .nav-item:hover .nav-dropdown{opacity:1;visibility:visible;transform:translateY(0)}
    .nav-dropdown a{display:block;padding:var(--spacing-sm) var(--spacing-md);color:#fff;font-size:1.05rem}
    .nav-dropdown a:hover{background-color:#3d0059;color:#FFEF76}
    .header-cta{margin-left:var(--spacing-sm);background-color:#71CEEB!important;color:#2f0048!important;border-color:#71CEEB!important}
    .nav-toggle{display:none;flex-direction:column;justify-content:center;align-items:center;width:44px;height:44px;background:none;border:none;cursor:pointer}
    .nav-toggle span{display:block;width:24px;height:3px;background-color:#71CEEB;margin:4px 0;transition:var(--transition-normal);border-radius:2px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--spacing-xs);padding:0.75rem 1.5rem;font-family:var(--font-primary);font-size:1.05rem;font-weight:600;border:2px solid transparent;border-radius:var(--radius-md);cursor:pointer;transition:var(--transition-normal);text-align:center}
    .btn-primary{background-color:var(--primary-purple);color:var(--white);border-color:var(--primary-purple)}
    .btn-outline-light{background-color:transparent;border-color:var(--white);color:var(--white)}
    .btn-lg{padding:1rem 2rem;font-size:1.1rem}
    @media(max-width:992px){.nav-toggle{display:flex}.nav-menu{position:fixed;top:0;right:-100%;width:85%;max-width:350px;height:100vh;background-color:#2f0048;flex-direction:column;align-items:flex-start;padding:80px var(--spacing-lg) var(--spacing-xxl);transition:right 0.3s ease;box-shadow:-5px 0 20px rgba(0,0,0,0.3);overflow-y:auto;z-index:1001}.nav-menu.active{right:0}.header-cta{display:none}.navbar-mascot{display:block}}
    </style>
